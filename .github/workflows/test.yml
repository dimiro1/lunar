name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Download CLI dependencies
        working-directory: lunar-cli
        run: go mod download

      - name: Download CLI integration dependencies
        working-directory: lunar-cli/integration
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Verify CLI dependencies
        working-directory: lunar-cli
        run: go mod verify

      - name: Verify CLI integration dependencies
        working-directory: lunar-cli/integration
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic $(go list ./... | grep -v /e2e)

      - name: Run CLI tests
        working-directory: lunar-cli
        run: go test -v ./...

      - name: Run CLI integration tests
        working-directory: lunar-cli/integration
        run: go test -tags integration -v -timeout 60s ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Build
        run: mise run build

      - name: Build CLI
        run: mise run build-cli

      - name: Run vet
        run: go vet ./...

      - name: Run vet on CLI
        working-directory: lunar-cli
        run: go vet ./...

      - name: Run golangci-lint
        run: mise run lint

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # The browser suite is slower than the unit tests; give it a clear ceiling
    # that sits above the `go test -timeout 20m` budget in `mise run test-e2e`,
    # so a genuine hang is reported by go test (with a stack dump) before the job
    # is force-killed.
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Run e2e tests
        run: mise run test-e2e
