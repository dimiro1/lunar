min_version = "2024.1.0"

# Toolchain — pinned for reproducible builds across machines and CI.
# Run `mise install` to fetch everything. `mise up` bumps to latest.
[tools]
go = "1.26.3"
golangci-lint = "2.12.2"
deno = "2.8.1"
goreleaser = "2.16.0"
air = "1.65.3"

# Frontend vendored dependency versions (used by the vendor-js task).
[env]
BINARY_NAME = "lunar"
CLI_BINARY_NAME = "lunar-cli"
BUILD_DIR = "build"
MITHRIL_VERSION = "2.3.8"
MONACO_VERSION = "0.55.1"
HIGHLIGHTJS_VERSION = "11.11.1"
JASMINE_VERSION = "6.0.1"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[tasks.build]
description = "Build the server"
run = [
  "mkdir -p $BUILD_DIR",
  "go build -o $BUILD_DIR/$BINARY_NAME ./cmd",
]
sources = ["cmd/**/*.go", "internal/**/*.go", "frontend/**/*", "go.mod", "go.sum"]
outputs = ["build/lunar"]

[tasks.build-cli]
description = "Build the CLI"
dir = "lunar-cli"
run = [
  "mkdir -p ../$BUILD_DIR",
  "go build -o ../$BUILD_DIR/$CLI_BINARY_NAME .",
]

[tasks.generate-graphql]
description = "Regenerate GraphQL code from the schema (gqlgen)"
run = "go generate ./internal/graph/..."

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------

[tasks.test]
description = "Run Go unit tests (server + CLI)"
run = [
  "go test $(go list ./... | grep -v /e2e)",
  "cd lunar-cli && go test ./...",
]

[tasks.test-cli-integration]
description = "Run CLI integration tests against a real server"
dir = "lunar-cli/integration"
run = "go test -tags integration -v -timeout 60s ./..."

[tasks.test-frontend]
description = "Open Jasmine frontend tests in browser"
run = "go run ./cmd/testserver"

[tasks.test-e2e]
description = "Run E2E tests with headless Chrome"
run = "go test -v ./e2e/..."

[tasks.test-all]
description = "Run all Go tests (unit + e2e)"
depends = ["test", "test-e2e"]

# ---------------------------------------------------------------------------
# Quality
# ---------------------------------------------------------------------------

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.fmt-frontend]
description = "Format frontend JS files with deno fmt"
run = "deno fmt --ignore=frontend/vendor frontend/"

[tasks.fix]
description = "Run go fix (modernize) on all packages"
run = [
  "go fix -fixtool=$(go env GOTOOLDIR)/fix ./...",
  "cd lunar-cli && go fix -fixtool=$(go env GOTOOLDIR)/fix ./...",
]

[tasks.all]
description = "Run lint, test, and build"
depends = ["lint", "test", "build"]

# ---------------------------------------------------------------------------
# Run / dev
# ---------------------------------------------------------------------------

[tasks.run]
description = "Build and run the application"
run = "go run ./cmd"

[tasks.dev]
description = "Start development mode with air (live reload)"
run = "air"

[tasks.seed]
description = "Create a few example functions on a running server (covers create/env/kv)"
depends = ["build-cli"]
run = '''
set -euo pipefail

SERVER="${LUNAR_SERVER:-http://localhost:${PORT:-3000}}"
TOKEN="${LUNAR_TOKEN:-${API_KEY:-}}"
if [ -z "$TOKEN" ] && [ -f "${DATA_DIR:-./data}/api_key.txt" ]; then
  TOKEN="$(cat "${DATA_DIR:-./data}/api_key.txt")"
fi
if [ -z "$TOKEN" ]; then
  echo "No API token found. Set LUNAR_TOKEN or API_KEY, or start the server once" >&2
  echo "so that ${DATA_DIR:-./data}/api_key.txt is generated, then re-run." >&2
  exit 1
fi
export LUNAR_SERVER="$SERVER" LUNAR_TOKEN="$TOKEN"
CLI="$BUILD_DIR/$CLI_BINARY_NAME"

# create_fn <name> <description> ; reads Lua from stdin ; prints the new id.
create_fn() {
  "$CLI" functions create --name "$1" --description "$2" --code - -o json \
    | sed -n 's/^  "id": "\([^"]*\)".*/\1/p' | head -1
}

echo "Seeding $SERVER ..."

# 1. hello — the simplest possible function.
create_fn hello "Returns a plain-text greeting" >/dev/null <<'LUA'
function handler(ctx, event)
  return { statusCode = 200, body = "Hello from Lunar!\n" }
end
LUA

# 2. echo — reflects the incoming request back as JSON.
create_fn echo "Echoes the request as JSON" >/dev/null <<'LUA'
function handler(ctx, event)
  local body, err = json.encode({
    method = event.method,
    path = event.relativePath,
    query = event.query,
    body = event.body,
  })
  if err then return { statusCode = 500, body = err } end
  return {
    statusCode = 200,
    headers = { ["Content-Type"] = "application/json" },
    body = body,
  }
end
LUA

# 3. counter — persists a hit count in the KV store; seed an initial value.
COUNTER_ID="$(create_fn counter "Counts requests via the KV store" <<'LUA'
function handler(ctx, event)
  local n = tonumber(kv.get("count") or "0") + 1
  kv.set("count", tostring(n))
  return { statusCode = 200, body = "count: " .. n .. "\n" }
end
LUA
)"
"$CLI" functions kv "$COUNTER_ID" --global=false --kv count=100 >/dev/null

# 4. greet — reads a greeting from an env var; seed the env var.
GREET_ID="$(create_fn greet "Greets using an env var" <<'LUA'
function handler(ctx, event)
  local greeting = env.get("GREETING") or "Hello"
  local who = event.query["name"] or "world"
  return { statusCode = 200, body = greeting .. ", " .. who .. "!\n" }
end
LUA
)"
"$CLI" functions env "$GREET_ID" --env GREETING=Howdy >/dev/null

echo "Done. Created: hello, echo, counter, greet"
echo "Try:  curl $SERVER/fn/$GREET_ID?name=Lunar"
'''

[tasks.docker]
description = "Run with Docker Compose"
run = "docker compose up"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf $BUILD_DIR"

# ---------------------------------------------------------------------------
# Release
# ---------------------------------------------------------------------------

[tasks.tag]
description = "Tag and push a server release, e.g. `mise run tag v0.5.2`"
usage = '''
arg "<version>" help="Release version, e.g. v0.5.2"
'''
run = '''
git tag "$usage_version"
git push origin "$usage_version"
echo "Tagged and pushed $usage_version. GoReleaser will create lunar-cli/$usage_version."
'''

# ---------------------------------------------------------------------------
# Frontend vendoring
# ---------------------------------------------------------------------------

[tasks.vendor-js]
description = "Download/update vendored JS dependencies"
run = '''
set -e
echo "Cleaning old vendored JS dependencies..."
rm -rf frontend/vendor/{mithril,monaco-editor,highlight.js,jasmine}

echo "Downloading vendored JS dependencies..."
mkdir -p frontend/vendor/{mithril,monaco-editor,highlight.js/styles,highlight.js/languages,jasmine}

echo "Downloading Mithril.js $MITHRIL_VERSION..."
curl -sL -o frontend/vendor/mithril/mithril.min.js \
  "https://unpkg.com/mithril@$MITHRIL_VERSION/mithril.min.js"

echo "Downloading Monaco Editor $MONACO_VERSION..."
curl -sL "https://registry.npmjs.org/monaco-editor/-/monaco-editor-$MONACO_VERSION.tgz" | \
  tar -xz -C frontend/vendor/monaco-editor --strip-components=1 package/min

echo "Downloading Highlight.js $HIGHLIGHTJS_VERSION..."
curl -sL -o frontend/vendor/highlight.js/highlight.min.js \
  "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/$HIGHLIGHTJS_VERSION/highlight.min.js"
curl -sL -o frontend/vendor/highlight.js/styles/github-dark.min.css \
  "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/$HIGHLIGHTJS_VERSION/styles/github-dark.min.css"
for lang in lua bash javascript python go json; do \
  curl -sL -o "frontend/vendor/highlight.js/languages/${lang}.min.js" \
    "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/$HIGHLIGHTJS_VERSION/languages/${lang}.min.js"; \
done

echo "Downloading Jasmine $JASMINE_VERSION..."
for file in jasmine.css jasmine.js jasmine-html.js boot0.js boot1.js; do \
  curl -sL -o "frontend/vendor/jasmine/${file}" \
    "https://unpkg.com/jasmine-core@$JASMINE_VERSION/lib/jasmine-core/${file}"; \
done

echo "Done! Vendored JS dependencies updated."
'''
